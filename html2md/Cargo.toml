[package]
name = "html2md"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "html2md"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
atty = "0.2"
regex = "1"
html5ever = "0.27"
scraper = "0.22"
ego-tree = "0.10"
ammonia = "4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
indoc = "2"
