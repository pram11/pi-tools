[package]
name = "code-analyzer"
version = "0.3.0"
edition = "2021"
description = "Deep static analysis for feature chart generation"

[[bin]]
name = "code-analyzer"
path = "src/main.rs"

[lib]
name = "code_analyzer"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
